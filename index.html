<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Image Sequence</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            height: 4000px; /* Creates scroll height for scrubbing */
        }

        /* Sticky container that stays fixed while scrolling through the page height */
        .sticky-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 10;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Sample text overlay that fades in/out based on scroll */
        .caption {
            position: absolute;
            bottom: 10vh;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .caption h2 {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.015em;
            margin-bottom: 8px;
        }

        .caption p {
            font-size: 1.2rem;
            color: #86868b;
        }

        .caption.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="sticky-container">
        <canvas id="hero-canvas"></canvas>
        
        <!-- Optional Apple-style text captions that trigger at specific scroll points -->
        <div id="caption-1" class="caption">
            <h2>Precision Crafted.</h2>
            <p>Designed down to the microscopic detail.</p>
        </div>
        <div id="caption-2" class="caption">
            <h2>Fluid Motion.</h2>
            <p>Scroll down to experience seamless performance.</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("hero-canvas");
        const context = canvas.getContext("2d");

        // CONFIGURATION: Adjust total frames and image naming structure here
        const frameCount = 60; // Change this to match the total number of images you uploaded
        
        // This automatically detects your GitHub Pages URL path or local folder
        const currentPath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
        const baseURL = window.location.origin + currentPath + '/'; 
        
        // Helper to format frame numbers with leading zeros (e.g., frame_001.jpg)
        const currentFrame = index => (
            `${baseURL}frame_${(index + 1).toString().padStart(3, '0')}.jpg`
        );

        const images = [];
        const frames = { frame: 0 };
        let imagesLoaded = 0;

        // Preload all images into memory for lag-free scrubbing
        function preloadImages() {
            for (let i = 0; i < frameCount; i++) {
                const img = new Image();
                img.src = currentFrame(i);
                img.onload = () => {
                    imagesLoaded++;
                    if (imagesLoaded === frameCount) {
                        renderFirstFrame();
                    }
                };
                images.push(img);
            }
        }

        function renderFirstFrame() {
            canvas.width = images[0].naturalWidth || 1920;
            canvas.height = images[0].naturalHeight || 1080;
            context.drawImage(images[0], 0, 0);
        }

        // Map scroll position to frame index using GSAP-style linear interpolation math
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const maxScrollTop = document.body.scrollHeight - window.innerHeight;
            const scrollFraction = scrollTop / maxScrollTop;
            
            const frameIndex = Math.min(
                frameCount - 1,
                Math.floor(scrollFraction * frameCount)
            );

            requestAnimationFrame(() => updateImage(frameIndex));
            updateCaptions(scrollFraction);
        });

        function updateImage(index) {
            if (images[index] && images[index].complete) {
                context.clearRect(0, 0, canvas.width, canvas.height);
                context.canvas.width = images[index].naturalWidth;
                context.canvas.height = images[index].naturalHeight;
                context.drawImage(images[index], 0, 0);
            }
        }

        // Simple trigger logic for text overlays based on scroll depth percentage
        function-caption-handler = {} // placeholder
        function updateCaptions(fraction) {
            const cap1 = document.getElementById('caption-1');
            const cap2 = document.getElementById('caption-2');

            if (fraction > 0.15 && fraction < 0.4) {
                cap1.classList.add('visible');
            } else {
                cap1.classList.remove('visible');
            }

            if (fraction > 0.55 && fraction < 0.8) {
                cap2.classList.add('visible');
            } else {
                cap2.classList.remove('visible');
            }
        }

        // Kick off preloading
        preloadImages();
    </script>
</body>
</html>
