<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Image Sequence</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f3f0e8; /* Matches RRM300 brand cream background */
            color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            height: 3000px;
        }

        .sticky-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f0e8;
            z-index: 10;
        }

        canvas {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 12px;
        }

        .caption {
            position: absolute;
            bottom: 8vh;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.85);
            padding: 15px 25px;
            border-radius: 12px;
            border: 2px solid #111;
            box-shadow: 6px 6px 0 #111;
        }

        .caption h2 {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -0.015em;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .caption p {
            font-size: 1rem;
            color: #555;
            font-family: "Space Mono", monospace;
        }

        .caption.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="sticky-container">
        <canvas id="hero-canvas"></canvas>
        
        <div id="caption-1" class="caption">
            <h2>Precision Crafted.</h2>
            <p>Designed down to the microscopic detail.</p>
        </div>
        <div id="caption-2" class="caption">
            <h2>Fluid Motion.</h2>
            <p>Scroll down to experience seamless performance.</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("hero-canvas");
        const context = canvas.getContext("2d");

        const frameCount = 60; 
        const currentPath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
        const baseURL = window.location.origin + currentPath + '/'; 
        
        const currentFrame = index => (
            `${baseURL}frame-${(index + 1).toString().padStart(3, '0')}.jpg`
        );

        const images = [];
        let imagesLoaded = 0;

        function preloadImages() {
            for (let i = 0; i < frameCount; i++) {
                const img = new Image();
                img.src = currentFrame(i);
                img.onload = () => {
                    imagesLoaded++;
                    if (imagesLoaded === frameCount) {
                        renderFirstFrame();
                    }
                };
                images.push(img);
            }
        }

        function renderFirstFrame() {
            canvas.width = images[0].naturalWidth || 1920;
            canvas.height = images[0].naturalHeight || 1080;
            context.drawImage(images[0], 0, 0);
        }

        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const maxScrollTop = document.body.scrollHeight - window.innerHeight;
            const scrollFraction = scrollTop / maxScrollTop;
            
            const frameIndex = Math.min(
                frameCount - 1,
                Math.floor(scrollFraction * frameCount)
            );

            requestAnimationFrame(() => updateImage(frameIndex));
            updateCaptions(scrollFraction);
        });

        function updateImage(index) {
            if (images[index] && images[index].complete) {
                context.clearRect(0, 0, canvas.width, canvas.height);
                context.canvas.width = images[index].naturalWidth;
                context.canvas.height = images[index].naturalHeight;
                context.drawImage(images[index], 0, 0);
            }
        }

        function updateCaptions(fraction) {
            const cap1 = document.getElementById('caption-1');
            const cap2 = document.getElementById('caption-2');

            if (fraction > 0.15 && fraction < 0.4) {
                cap1.classList.add('visible');
            } else {
                cap1.classList.remove('visible');
            }

            if (fraction > 0.55 && fraction < 0.8) {
                cap2.classList.add('visible');
            } else {
                cap2.classList.remove('visible');
            }
        }

        preloadImages();
    </script>
</body>
</html>
